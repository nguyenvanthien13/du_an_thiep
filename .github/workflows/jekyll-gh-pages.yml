name: Build and deploy Greeting Card Studio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      - name: Install dependencies
        working-directory: greeting-card-studio
        run: npm install --no-audit --no-fund
      - name: Build with Supabase publishable credentials
        working-directory: greeting-card-studio
        env:
          VITE_SUPABASE_URL: https://nhopbsdphempwklmzzdf.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_fZD4veyjQU1v_KaEl7aPDA_j06sKyXI
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: greeting-card-studio/dist
      - id: deployment
        uses: actions/deploy-pages@v4
